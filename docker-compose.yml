services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scraper
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: scraper_platform:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["scraper-api"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@postgres:5432/scraper
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: scraper_platform:local
    command: ["scraper-worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@postgres:5432/scraper
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

