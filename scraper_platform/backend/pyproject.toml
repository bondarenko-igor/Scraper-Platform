[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-platform"
version = "0.1.0"
description = "Distributed scraping platform with Playwright, PostgreSQL, FastAPI, rotating proxies, and AI extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "playwright>=1.48",
  "openai>=1.50",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "markdownify>=0.13",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[project.scripts]
scraper-platform = "scraper_platform.backend.app.cli:main"
scraper-api = "scraper_platform.backend.app.cli:api_main"
scraper-worker = "scraper_platform.backend.app.cli:worker_main"
scraper-init-db = "scraper_platform.backend.app.cli:init_db_main"

[tool.setuptools]
include-package-data = true
py-modules = ["olx_parser", "cache", "rate_limiter", "utils"]

[tool.setuptools.packages.find]
include = ["scraper_platform*"]
